/* Layout: one centered column over a blurred, burgundy-washed portrait; every link is a raised frosted-glass row with a gold-ringed icon, turning gold when touched. Single deliberate look in both themes. */
:root {
  --ground: #160406;
  --wash: rgba(58, 15, 22, .80);
  --wash-deep: rgba(22, 4, 6, .96);
  --ink: #f7efe6;
  --muted: #d0baa9;
  --gold-hi: #fcebd6;
  --gold: #f5d7b5;
  --gold-lo: #c9965f;
  --gold-glow: rgba(245, 215, 181, .38);
  --frost: linear-gradient(160deg, rgba(255,240,230,.20) 0%, rgba(120,40,52,.30) 45%, rgba(40,8,12,.30) 100%);
  --frost-hover: linear-gradient(160deg, rgba(255,240,230,.28) 0%, rgba(140,48,62,.36) 45%, rgba(50,10,16,.34) 100%);
  --frost-edge: rgba(245, 215, 181, .30);
  --shine: rgba(255, 236, 214, .38);
  --gold-ring: linear-gradient(140deg, var(--gold-hi) 0%, var(--gold) 38%, var(--gold-lo) 62%, var(--gold-hi) 100%);
  --display: "Instrument Serif", "Didot", "Times New Roman", serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--ground); }
body {
  position: relative;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
}

.backdrop::after {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(70% 40% at 50% 8%, rgba(251, 237, 192, .14), transparent 70%),
    linear-gradient(180deg, var(--wash) 0%, var(--wash-deep) 75%);
}
.wrap {
  position: relative; z-index: 1;
  max-width: 580px;
  margin: 0 auto;
  padding-block: 56px 44px;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 16px;
}
header { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; margin-bottom: 18px; }
.photo {
  width: 144px; height: 144px; border-radius: 50%;
  padding: 1.5px;
  background: var(--gold-ring);
  box-shadow: 0 0 0 1px rgba(255,255,255,.25), 0 0 28px var(--gold-glow), 0 16px 36px rgba(0,0,0,.45);
}
.photo img { display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: 50% 30%; border: 1.5px solid var(--ground); }
h1 { margin: 6px 0 0; font-family: var(--display); font-weight: 400; font-size: clamp(46px, 13vw, 60px); line-height: 1; letter-spacing: -.005em; text-wrap: balance; text-shadow: 0 2px 14px rgba(0,0,0,.35); }
.handle { margin: 0; color: var(--muted); font-size: 15px; }
.socials { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.socials a {
  display: grid; place-items: center;
  width: 48px; height: 48px; border-radius: 50%;
  color: var(--ink);
  background: var(--frost);
  border: 1px solid var(--frost-edge);
  box-shadow: inset 0 1px 0 var(--shine), inset 0 -2px 6px rgba(0,0,0,.18), 0 6px 14px rgba(0,0,0,.28);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  backdrop-filter: blur(22px) saturate(160%);
  transition: transform .2s, border-color .2s, box-shadow .2s, color .2s;
}
.socials svg { width: 21px; height: 21px; color: var(--gold); }
.socials a:hover svg, .socials a:focus-visible svg { color: var(--gold-hi); }
.label {
  margin: 20px 0 2px; display: flex; align-items: center; gap: 12px;
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .2em; color: var(--gold-hi);
}
.label::before, .label::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
.label::after { background: linear-gradient(90deg, var(--gold), transparent); }
.link {
  display: flex; align-items: center; gap: 14px;
  min-height: 66px; padding: 10px 16px 10px 10px; border-radius: 18px;
  color: var(--ink); text-decoration: none; font-weight: 600; font-size: 16px; letter-spacing: .01em;
  background: var(--frost);
  border: 1px solid var(--frost-edge);
  box-shadow:
    inset 0 1px 0 var(--shine),
    inset 0 -3px 8px rgba(0,0,0,.16),
    0 2px 0 rgba(255,255,255,.08),
    0 10px 22px rgba(0,0,0,.26),
    0 2px 5px rgba(0,0,0,.2);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  backdrop-filter: blur(24px) saturate(160%);
  transition: transform .2s, border-color .2s, box-shadow .2s, background .2s, color .2s;
}
.link .text { flex: 1; min-width: 0; text-align: center; text-shadow: 0 1px 6px rgba(0,0,0,.25); }
.badge {
  flex: none; width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  padding: 1.5px; background: var(--gold-ring);
  box-shadow: 0 3px 8px rgba(0,0,0,.3);
}
.badge span {

footer { margin-top: 30px; text-align: center; font-size: 13px; color: var(--muted); letter-spacing: .08em; }

/* Featured YouTube row: gold line orbiting the edge */
@property --orbit { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
.link.featured {
  position: relative;
  min-height: 88px; padding-block: 14px;
  border-color: rgba(217, 180, 90, .45);
}
.link.featured::before {
  content: ""; position: absolute; inset: -2px; border-radius: 20px; padding: 2px; pointer-events: none;
  background: conic-gradient(from var(--orbit), transparent 0%, transparent 58%, var(--gold-lo) 70%, var(--gold) 80%, var(--gold-hi) 86%, transparent 94%, transparent 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);

}

/* Expandable Live Stream Donation or Gifting */
.gift { display: flex; flex-direction: column; }
button.link { width: 100%; font: inherit; cursor: pointer; -webkit-appearance: none; appearance: none; -webkit-tap-highlight-color: transparent; }
.gift-toggle .chev { flex: none; width: 44px; display: grid; place-items: center; color: var(--gold); transition: transform .35s cubic-bezier(.3,1.4,.5,1), color .2s; }
.gift-toggle .chev svg { width: 22px; height: 22px; }
.gift.open .gift-toggle .chev { transform: rotate(180deg); color: var(--gold-hi); }
.gift.open .gift-toggle { border-color: var(--gold); box-shadow: inset 0 1px 0 var(--shine), inset 0 -3px 8px rgba(0,0,0,.14), 0 0 0 1px var(--gold), 0 0 22px var(--gold-glow), 0 12px 26px rgba(0,0,0,.3); }
.gift-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s ease; }
.gift.open .gift-panel { grid-template-rows: 1fr; }
.gift-inner { min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 0 10px; transition: padding .45s ease; }
.gift.open .gift-inner { padding: 14px 10px 4px; }
.gift-inner .link { min-height: 58px; }
.gift-inner .link .text { font-size: 15px; }
.gift-inner .badge { width: 40px; height: 40px; }
.gift-inner .link .spacer { width: 40px; }
.gift .sublink { opacity: 0; transform: translateY(-10px) scale(.96); transition: opacity .3s ease, transform .35s cubic-bezier(.22,1.5,.4,1), border-color .2s, box-shadow .2s, background .2s; transition-delay: 0s; }
.gift.open .sublink { opacity: 1; transform: none; transition-delay: calc(var(--i) * .07s + .1s); }
.gift.open .sublink:hover, .gift.open .sublink:focus-visible { transform: translateY(-3px); transition-delay: 0s; }
.badge .logo { width: 23px; height: 23px; display: block; }
.gift-inner .badge .logo { width: 27px; height: 27px; }
.label { font-family: "Shamery", var(--display); font-weight: 400; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-hi); }
/* Featured waitlist card with thumbnail */
.link.promo { flex-direction: column; align-items: stretch; gap: 12px; padding: 10px 10px 16px; border-color: rgba(245,215,181,.5); }
.promo-img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; border: 1px solid rgba(245,215,181,.35); box-shadow: 0 6px 18px rgba(0,0,0,.35); }
.promo-row { display: flex; justify-content: center; }
.link.promo .text { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.link.promo .title { font-size: 19px; }
.link.promo .rule { width: 120px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.link.promo .sub { font-family: var(--body); font-weight: 600; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-hi); word-spacing: normal; }
/* YouTube button: two-line text, no extra glow */
.link.featured.calm { min-height: 66px; padding-block: 10px; border-color: var(--frost-edge); box-shadow: inset 0 1px 0 var(--shine), inset 0 -3px 8px rgba(0,0,0,.16), 0 2px 0 rgba(255,255,255,.08), 0 10px 22px rgba(0,0,0,.26), 0 2px 5px rgba(0,0,0,.2); }
.link.featured.calm:hover { border-color: var(--gold); box-shadow: inset 0 1px 0 var(--shine), 0 0 0 1px var(--gold), 0 0 26px var(--gold-glow), 0 16px 30px rgba(0,0,0,.32); }
/* Waitlist card: featured glow and gold orbit */
.link.featured.promo { padding: 10px 10px 16px; }
.link.featured.promo .title { font-size: 19px; align-self: auto; }
.link.featured.promo .rule { width: 120px; }
/* Waitlist card: photo only, real button on it */
.link.featured.promo { padding: 8px; }
.promo-media { position: relative; display: block; }
.promo-media .promo-img { margin: 0; }
.promo-cta {
  position: absolute; left: 7.3%; top: 69%;
  display: inline-flex; align-items: center; gap: .5em;
  padding: .9em 1.4em; border-radius: 999px;
  font-family: var(--body); font-weight: 700; font-size: clamp(11px, 3vw, 14px); letter-spacing: .14em; text-transform: uppercase; word-spacing: normal;
  color: #2a080e; background: linear-gradient(140deg, #fcebd6, #f5d7b5 40%, #c9965f 70%, #fcebd6);
  box-shadow: 0 0 0 1px rgba(255,243,226,.6), 0 0 22px rgba(245,215,181,.55), 0 10px 24px rgba(0,0,0,.45);
  transition: transform .2s, box-shadow .2s;
}
.promo-cta svg { width: 1.2em; height: 1.2em; }
.link.promo:hover .promo-cta { transform: translateY(-2px) scale(1.04); box-shadow: 0 0 0 1px #fff3e2, 0 0 32px rgba(252,235,214,.8), 0 14px 28px rgba(0,0,0,.5); }

<script>
(function () {
  var el = document.querySelector('.reach'); if (!el) return;
  var count = el.querySelector('.count'), plus = el.querySelector('.plus');
  var target = 22000, dur = 3600, done = false;
  function fmt(n) { return n < 1000 ? String(n) : (n >= target ? '22K' : (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K'); }
  function run() {
    if (done) return; done = true;
    var t0 = null;
    function step(t) {
      if (t0 === null) t0 = t;
      var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      count.textContent = fmt(Math.max(1, Math.round(1 + (target - 1) * e)));
      if (p < 1) requestAnimationFrame(step); else { plus.classList.remove('waiting'); plus.classList.add('lit'); }
    }
    requestAnimationFrame(step);
  }
  count.textContent = '1'; plus.classList.add('waiting');
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(run, 350); }); else setTimeout(run, 350);
  setTimeout(function () { if (!done) run(); }, 1500);
})();
</script>
<script>
(function () {
  if (!('IntersectionObserver' in window)) return;
  var items = [].slice.call(document.querySelectorAll('.socials a, .link:not(.sublink)'));
  document.documentElement.classList.add('js-pop');
  var batch = 0, timer = null;
  function pop(el) {
    el.style.setProperty('--d', (batch++ * 0.09) + 's');
    el.classList.remove('await'); el.classList.add('popped');
    clearTimeout(timer); timer = setTimeout(function () { batch = 0; }, 120);
  }
  items.forEach(function (el) { el.classList.add('await'); });
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (x) { if (x.isIntersecting) { io.unobserve(x.target); pop(x.target); } });
  }, { threshold: .25, rootMargin: '0px 0px -8% 0px' });
  items.forEach(function (el) { io.observe(el); });
  setTimeout(function () { items.forEach(function (el) { if (el.classList.contains('await')) { io.unobserve(el); pop(el); } }); }, 6000);
})();
</script>
